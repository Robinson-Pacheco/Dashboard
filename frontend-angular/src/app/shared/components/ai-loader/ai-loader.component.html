<div class="bg-gradient-to-br from-utmach-blue-50 to-utmach-sky-50 dark:from-utmach-blue-900/20 dark:to-utmach-sky-900/20 rounded-lg p-12 border border-utmach-blue-200 dark:border-utmach-blue-800">
  <div class="flex flex-col items-center justify-center space-y-6">
    <!-- Animated Icon -->
    <div class="relative">
      <div class="absolute inset-0 bg-utmach-blue dark:bg-utmach-blue rounded-full animate-ping opacity-20"></div>
      <div class="absolute inset-0 bg-utmach-blue dark:bg-utmach-blue rounded-full animate-pulse opacity-40"></div>
      <div class="relative bg-utmach-blue dark:bg-utmach-sky rounded-full p-6">
        <lucide-icon [img]="Brain" class="w-12 h-12 text-white animate-pulse"></lucide-icon>
      </div>
    </div>

    <!-- Title -->
    <h3 class="text-xl font-bold text-utmach-blue dark:text-utmach-sky text-center">
      {{ title() }}
    </h3>

    <!-- Messages with fade animation -->
    <div class="min-h-[60px] flex items-center justify-center">
      <p class="text-utmach-blue-700 dark:text-utmach-sky text-center text-lg animate-pulse">
        {{ currentMessage() }}
      </p>
    </div>

    <!-- Loading Dots -->
    <div class="flex items-center space-x-2">
      <div class="w-3 h-3 bg-utmach-blue dark:bg-utmach-sky rounded-full animate-bounce" style="animation-delay: 0ms;"></div>
      <div class="w-3 h-3 bg-utmach-blue dark:bg-utmach-sky rounded-full animate-bounce" style="animation-delay: 150ms;"></div>
      <div class="w-3 h-3 bg-utmach-blue dark:bg-utmach-sky rounded-full animate-bounce" style="animation-delay: 300ms;"></div>
    </div>

    <!-- Progress Bar -->
    <div class="w-full max-w-md">
      <div class="h-2 bg-utmach-blue-200 dark:bg-utmach-blue-800 rounded-full overflow-hidden">
        <div class="h-full bg-gradient-to-r from-utmach-blue to-utmach-sky rounded-full animate-[loading_2s_ease-in-out_infinite]"
             style="width: 100%; animation: loading 2s ease-in-out infinite;"></div>
      </div>
    </div>

    <!-- Sparkles decoration -->
    <div class="flex space-x-4 text-utmach-blue dark:text-utmach-sky">
      <lucide-icon [img]="Sparkles" class="w-5 h-5 animate-pulse" style="animation-delay: 0ms;"></lucide-icon>
      <lucide-icon [img]="Sparkles" class="w-5 h-5 animate-pulse" style="animation-delay: 200ms;"></lucide-icon>
      <lucide-icon [img]="Sparkles" class="w-5 h-5 animate-pulse" style="animation-delay: 400ms;"></lucide-icon>
    </div>
  </div>
</div>

<style>
  @keyframes loading {
    0% {
      transform: translateX(-100%);
    }
    100% {
      transform: translateX(100%);
    }
  }
</style>

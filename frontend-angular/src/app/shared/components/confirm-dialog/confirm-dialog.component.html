@if (isOpen()) {
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black bg-opacity-50 transition-opacity z-40"
       (click)="cancel()"></div>
  
  <!-- Dialog -->
  <div class="fixed inset-0 z-50 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4 text-center">
      <div class="relative transform overflow-hidden rounded-lg bg-white dark:bg-gray-800 text-left shadow-xl transition-all w-full max-w-lg">
        <!-- Close button -->
        <button 
          (click)="cancel()"
          class="absolute top-4 right-4 text-gray-400 hover:text-gray-500 dark:hover:text-gray-300">
          <lucide-icon [name]="XIcon" class="h-6 w-6"></lucide-icon>
        </button>

        <div class="p-6">
          <!-- Icon -->
          <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-red-100 dark:bg-red-900/20">
            <lucide-icon [name]="AlertTriangleIcon" class="h-6 w-6 text-red-600 dark:text-red-400"></lucide-icon>
          </div>
          
          <!-- Content -->
          <div class="mt-3 text-center">
            <h3 class="text-lg font-semibold leading-6 text-gray-900 dark:text-white">
              {{ title() }}
            </h3>
            <div class="mt-2">
              <p class="text-sm text-gray-500 dark:text-gray-400">
                {{ message() }}
              </p>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="bg-gray-50 dark:bg-gray-900/50 px-6 py-4 flex flex-col-reverse sm:flex-row sm:justify-end gap-3">
          <button
            type="button"
            (click)="cancel()"
            class="inline-flex w-full justify-center rounded-md bg-white dark:bg-gray-700 px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-200 shadow-sm hover:bg-gray-50 dark:hover:bg-gray-600 border border-gray-300 dark:border-gray-600 sm:w-auto">
            {{ cancelText() }}
          </button>
          <button
            type="button"
            (click)="confirm()"
            class="inline-flex w-full justify-center rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800 sm:w-auto">
            {{ confirmText() }}
          </button>
        </div>
      </div>
    </div>
  </div>
}

<div class="h-screen w-screen overflow-hidden flex flex-col items-center justify-center bg-slate-50 dark:bg-slate-900 p-4 font-roboto select-none">

  <!-- Centered Login Card Container -->
  <div class="max-w-sm sm:max-w-md w-full bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200/80 dark:border-slate-700 overflow-hidden">
    
    <!-- Top Institutional Accent Bar -->
    <div class="utmach-accent-bar"></div>

    <div class="p-6 sm:p-8">
      <!-- Header with UTMACH Logo & Title -->
      <div class="text-center mb-6">
        <img 
          src="logo-utmach.png" 
          alt="Universidad Técnica de Machala" 
          class="h-20 sm:h-24 w-auto object-contain mx-auto mb-3"
        />
        <h1 class="text-lg sm:text-xl font-bold text-[#005CA2] dark:text-[#53AAE1] font-roboto leading-tight uppercase">
          Universidad Técnica de Machala
        </h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 font-roboto mt-1">
          Sistema BI de Analítica Académica
        </p>
      </div>

      <!-- Error Alert -->
      @if (errorMessage()) {
        <div class="mb-4 error-utmach-box p-3 rounded-lg flex items-center gap-2.5">
          <lucide-icon [name]="AlertCircle" class="h-4 w-4 text-[#C2354A] flex-shrink-0"></lucide-icon>
          <span class="text-xs text-[#C2354A] font-medium leading-tight font-roboto">
            {{ errorMessage() }}
          </span>
        </div>
      }

      <!-- Login Form -->
      <form class="space-y-4" (ngSubmit)="onSubmit()">
        
        <!-- Username Field -->
        <div>
          <label for="username" class="block text-xs font-bold text-[#005CA2] dark:text-slate-300 mb-1 uppercase tracking-wider font-roboto">
            Usuario
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <lucide-icon [name]="User" class="h-4 w-4 text-[#005CA2]"></lucide-icon>
            </div>
            <input 
              id="username" 
              name="username" 
              type="text" 
              required 
              class="input-utmach-field block w-full pl-9 pr-3 py-2.5 text-sm text-slate-800 dark:text-slate-100 dark:bg-slate-900 rounded-lg border border-slate-300 dark:border-slate-600 focus:outline-none placeholder-slate-400 font-roboto" 
              placeholder="Ingresa tu usuario"
              [(ngModel)]="credentials().username"
              (ngModelChange)="updateCredential('username', $event)"
            />
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-xs font-bold text-[#005CA2] dark:text-slate-300 mb-1 uppercase tracking-wider font-roboto">
            Contraseña
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <lucide-icon [name]="Lock" class="h-4 w-4 text-[#005CA2]"></lucide-icon>
            </div>
            <input 
              id="password" 
              name="password" 
              [type]="showPassword() ? 'text' : 'password'" 
              required 
              class="input-utmach-field block w-full pl-9 pr-10 py-2.5 text-sm text-slate-800 dark:text-slate-100 dark:bg-slate-900 rounded-lg border border-slate-300 dark:border-slate-600 focus:outline-none placeholder-slate-400 font-roboto" 
              placeholder="••••••••••••"
              [(ngModel)]="credentials().password"
              (ngModelChange)="updateCredential('password', $event)"
            />
            <button 
              type="button" 
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-[#005CA2] focus:outline-none transition-colors"
              (click)="togglePasswordVisibility()"
              aria-label="Mostrar u ocultar contraseña"
            >
              @if (showPassword()) {
                <lucide-icon [name]="EyeOff" class="h-4 w-4 text-[#C2354A]"></lucide-icon>
              } @else {
                <lucide-icon [name]="Eye" class="h-4 w-4 text-slate-400 hover:text-[#005CA2]"></lucide-icon>
              }
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button 
            type="submit" 
            class="btn-utmach-login w-full py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 text-sm font-bold uppercase tracking-wider text-white disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer font-roboto"
            [disabled]="authService.isLoading()"
          >
            @if (authService.isLoading()) {
              <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>Accediendo...</span>
            } @else {
              <span>Iniciar Sesión</span>
            }
          </button>
        </div>
      </form>

      <!-- Institutional Footer Note -->
      <div class="mt-5 pt-3 border-t border-slate-100 dark:border-slate-700/60 text-center">
        <p class="text-[11px] text-slate-400 dark:text-slate-500 font-roboto">
          © Universidad Técnica de Machala — Dirección de Admisión
        </p>
      </div>

    </div>
  </div>

</div>

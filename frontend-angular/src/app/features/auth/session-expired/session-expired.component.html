<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 p-4">
  <div class="max-w-md w-full bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 text-center">
    <!-- Icon -->
    <div class="mb-6 flex justify-center">
      <div class="relative">
        <div class="absolute inset-0 bg-red-500 opacity-20 blur-2xl rounded-full"></div>
        <div class="relative bg-red-100 dark:bg-red-900/30 rounded-full p-6">
          <lucide-icon [name]="Clock" class="w-16 h-16 text-red-600 dark:text-red-400"></lucide-icon>
        </div>
      </div>
    </div>

    <!-- Title -->
    <h1 class="text-2xl md:text-3xl font-bold text-gray-900 dark:text-white mb-3">
      Sesión Expirada
    </h1>

    <!-- Message -->
    <p class="text-gray-600 dark:text-gray-400 mb-8 leading-relaxed">
      Tu sesión ha expirado por inactividad o el token de autenticación ya no es válido.
      Por favor, inicia sesión nuevamente para continuar.
    </p>

    <!-- Button -->
    <button
      (click)="goToLogin()"
      class="w-full bg-utmach-blue hover:bg-utmach-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-lg transition-all duration-200 transform hover:scale-105 flex items-center justify-center gap-2"
    >
      <lucide-icon [name]="LogIn" class="w-5 h-5"></lucide-icon>
      <span>Iniciar Sesión</span>
    </button>

    <!-- Additional Info -->
    <div class="mt-6 pt-6 border-t border-gray-200 dark:border-gray-700">
      <p class="text-xs text-gray-500 dark:text-gray-400">
        Si el problema persiste, contacta con el administrador del sistema.
      </p>
    </div>
  </div>
</div>

<div class="p-4 md:p-6 bg-slate-50 dark:bg-slate-950 min-h-screen">
  <!-- Header -->
  <div class="mb-6">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-xl md:text-2xl font-bold text-slate-900 dark:text-white">Minería de Datos</h1>
        <p class="mt-1 text-sm text-slate-600 dark:text-slate-400">Análisis avanzado y recomendaciones</p>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="bg-white dark:bg-slate-900 shadow-md rounded-xl p-4 mb-6 border border-slate-200/80 dark:border-slate-800">
    <div class="flex items-center mb-3">
      <lucide-icon [name]="Filter" class="w-5 h-5 text-slate-500 dark:text-slate-400 mr-2"></lucide-icon>
      <h2 class="text-lg font-semibold text-slate-900 dark:text-white">Filtros</h2>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
          Período
        </label>
        <select
          [(ngModel)]="selectedPeriod"
          class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-utmach-blue focus:border-blue-500 bg-white dark:bg-slate-800 text-slate-900 dark:text-white"
        >
          @for (period of availablePeriods(); track period) {
            <option [value]="period">{{ period }}</option>
          }
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
          Año
        </label>
        <select
          [(ngModel)]="selectedYear"
          class="w-full px-3 py-2 border border-slate-300 dark:border-slate-700 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-utmach-blue focus:border-blue-500 bg-white dark:bg-slate-800 text-slate-900 dark:text-white"
        >
          @for (year of availableYears(); track year) {
            <option [value]="year">{{ year }}</option>
          }
        </select>
      </div>
      <div class="flex items-end">
        <button 
          (click)="applyFilters()"
          class="w-full px-4 py-2 bg-utmach-blue hover:bg-utmach-blue-700 text-white rounded-lg shadow-sm text-sm font-medium transition-colors"
        >
          Aplicar Filtros
        </button>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  @if (isLoading()) {
    <div class="bg-white dark:bg-gray-800 shadow-md rounded-lg p-12">
      <div class="flex justify-center items-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
      </div>
    </div>
  } @else {
    <!-- Router Outlet for Child Components -->
    <router-outlet />
  }
</div>

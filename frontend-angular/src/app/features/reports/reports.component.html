<div class="p-4 md:p-6 bg-slate-50 dark:bg-slate-950 min-h-screen">
  <!-- Header -->
  <div class="mb-6">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-xl md:text-2xl font-bold text-slate-900 dark:text-white">Minería de Datos</h1>
        <p class="mt-1 text-sm text-slate-600 dark:text-slate-400">Análisis avanzado y recomendaciones</p>
      </div>
    </div>
  </div>

  <!-- Filters Card -->
  <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm hover:shadow-md rounded-2xl p-5 md:p-6 transition-all duration-200 mb-6">
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-utmach-blue dark:text-utmach-sky shadow-inner">
          <lucide-icon [name]="Filter" class="w-5 h-5"></lucide-icon>
        </div>
        <div>
          <h2 class="text-base md:text-lg font-bold text-slate-900 dark:text-white tracking-tight">Filtros de Análisis</h2>
          <p class="text-xs text-slate-500 dark:text-slate-400">Selecciona el período o año para actualizar la minería de datos</p>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
          Período
        </label>
        <select
          [(ngModel)]="selectedPeriod"
          class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-900 dark:text-white text-sm font-medium focus:ring-2 focus:ring-utmach-blue/30 focus:border-utmach-blue dark:focus:ring-utmach-sky/30 dark:focus:border-utmach-sky outline-none transition-all cursor-pointer hover:border-slate-300 dark:hover:border-slate-600"
        >
          @for (period of availablePeriods(); track period) {
            <option [value]="period">{{ period }}</option>
          }
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
          Año
        </label>
        <select
          [(ngModel)]="selectedYear"
          class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-900 dark:text-white text-sm font-medium focus:ring-2 focus:ring-utmach-blue/30 focus:border-utmach-blue dark:focus:ring-utmach-sky/30 dark:focus:border-utmach-sky outline-none transition-all cursor-pointer hover:border-slate-300 dark:hover:border-slate-600"
        >
          @for (year of availableYears(); track year) {
            <option [value]="year">{{ year }}</option>
          }
        </select>
      </div>
      <div class="flex items-end">
        <button 
          (click)="applyFilters()"
          class="w-full px-5 py-2.5 bg-utmach-blue hover:bg-utmach-blue-700 active:scale-[0.98] text-white rounded-xl shadow-sm hover:shadow-md text-sm font-semibold transition-all duration-150 flex items-center justify-center gap-2"
        >
          Aplicar Filtros
        </button>
      </div>
    </div>
  </div>

  <!-- Container with smooth loading overlay -->
  <div class="relative min-h-[400px]">
    @if (isLoading()) {
      <div class="absolute inset-0 bg-white/70 dark:bg-slate-900/70 backdrop-blur-[1px] z-40 flex items-center justify-center rounded-xl transition-all min-h-[300px]">
        <div class="flex flex-col items-center gap-3">
          <div class="animate-spin rounded-full h-10 w-10 border-4 border-utmach-blue border-t-transparent"></div>
          <span class="text-xs font-medium text-slate-600 dark:text-slate-300">Cargando datos...</span>
        </div>
      </div>
    }

    <!-- Router Outlet for Child Components -->
    <router-outlet />
  </div>
</div>

<div
  class="min-h-screen bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300 flex flex-col">
  <!-- Header -->
  <header class="bg-gray-50 dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <!-- Logo/Brand -->
        <div class="flex items-center">
          <h1 class="text-xl font-semibold text-gray-900 dark:text-white">
            BI Dashboard
          </h1>
        </div>

        <!-- Navigation and User Actions -->
        <div class="flex items-center space-x-4">
          <!-- Navigation Links -->
          @if (isAuthenticated()) {
          <button (click)="navigateToDashboard()"
            class="text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white px-3 py-2 rounded-md text-sm font-medium">
            Dashboard
          </button>
          } @else {
          <button (click)="navigateToLogin()"
            class="text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white px-3 py-2 rounded-md text-sm font-medium">
            Iniciar Sesión
          </button>
          }

          <!-- User Menu -->
          @if (isAuthenticated() && currentUser()) {
          <div class="relative">
            <button (click)="toggleUserMenu()"
              class="flex items-center space-x-2 text-sm rounded-full focus:outline-none" id="user-menu-button"
              aria-expanded="false" aria-haspopup="true">
              <div class="hidden md:block text-left">
                <div class="text-sm font-medium text-gray-900 dark:text-white">
                  {{ currentUser()?.names }}
                </div>
                <div class="text-xs text-gray-500 dark:text-gray-400">
                  {{ currentUser()?.role }}
                </div>
              </div>
              <div class="h-8 w-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-medium">
                {{ currentUser()?.names?.charAt(0) }}
              </div>
              <lucide-icon [name]="ChevronDown" class="h-4 w-4 text-gray-500 dark:text-gray-400"></lucide-icon>
            </button>

            <!-- Dropdown menu -->
            @if (isUserMenuOpen()) {
            <div
              class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white dark:bg-gray-800 ring-1 ring-black ring-opacity-5 divide-y divide-gray-100 dark:divide-gray-700 focus:outline-none z-10"
              role="menu" aria-orientation="vertical" aria-labelledby="user-menu-button" tabindex="-1">
              <div class="py-1" role="none">
                <div class="px-4 py-2 text-sm text-gray-700 dark:text-gray-300" role="none">
                  <div class="font-medium">{{ currentUser()?.names }}</div>
                  <div class="text-gray-500 dark:text-gray-400">{{ currentUser()?.email }}</div>
                  <div class="text-xs text-gray-500 dark:text-gray-400">{{ currentUser()?.role }}</div>
                </div>
              </div>
              <div class="py-1" role="none">
                <button (click)="logout()"
                  class="block w-full text-left px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-gray-100 dark:hover:bg-gray-700"
                  role="menuitem" tabindex="-1">
                  Cerrar Sesión
                </button>
              </div>
            </div>
            }
          </div>
          }

          <!-- Dark Mode Toggle -->
          <button (click)="toggleDarkMode()"
            class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800"
            [attr.aria-label]="(isDarkMode$ | async) ? 'Switch to light mode' : 'Switch to dark mode'">
            <!-- Sun Icon -->
            <svg *ngIf="!(isDarkMode$ | async)" class="w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
                clip-rule="evenodd" />
            </svg>
            <!-- Moon Icon -->
            <svg *ngIf="(isDarkMode$ | async)" class="w-5 h-5 text-blue-400" fill="currentColor" viewBox="0 0 20 20">
              <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1">
    <router-outlet></router-outlet>

  </main>

  <!-- Footer -->
  <footer class="bg-gray-50 dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <p class="text-center text-sm text-gray-600 dark:text-gray-400">
        © {{ currentYear }} BI Dashboard. All rights reserved.
      </p>
    </div>
  </footer>
</div>
